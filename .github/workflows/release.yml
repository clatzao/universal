name: Release APK

on:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Recriar chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error title=Secrets ausentes::Cadastre ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD em Settings > Secrets and variables > Actions. Sem eles o APK não pode ser assinado com a chave de release e não atualizaria o app instalado."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/universal-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=universal\nstoreFile=universal-release.jks\n' "$KS_PW" "$KS_PW" > android/key.properties

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Conferir assinatura
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk UniversalApp.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs UniversalApp.apk | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::APK assinado com a chave de debug."
            exit 1
          fi

      - name: Novidades
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo "Versão 1.0.${{ github.run_number }}"
            echo
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git log --no-merges --pretty='- %s' "$BEFORE..${{ github.sha }}"
            else
              git log -1 --pretty='- %s'
            fi
          } > notes.md
          cat notes.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Universal 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: UniversalApp.apk
          make_latest: true
